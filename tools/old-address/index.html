<!doctype html>
<!-- Put this file in a new public GitHub repo named "bolles-planner" (with
     GitHub Pages on) so the old address forwards to the new one. It keeps
     everything after the address, so old sign-in and reset links still work. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rotation Planner has moved</title>
    <script>
      location.replace('https://legoneil.github.io/rotation-planner/' + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://legoneil.github.io/rotation-planner/" />
  </head>
  <body style="font: 16px/1.5 system-ui, sans-serif; padding: 24px">
    <p>Rotation Planner has moved to <a href="https://legoneil.github.io/rotation-planner/">legoneil.github.io/rotation-planner</a>.</p>
  </body>
</html>
